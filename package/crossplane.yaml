apiVersion: meta.pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-upcloud
  annotations:
    meta.crossplane.io/maintainer: UpCloud and Upbound
    meta.crossplane.io/source: github.com/crossplane-contrib/provider-upcloud
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      Crossplane provider to manage UpCloud services in Kubernetes.
    meta.crossplane.io/readme: |
      Provider UpCloud is a Crossplane provider for [UpCloud](https://upcloud.com)
      built with Upjet and maintained by UpCloud and Upbound in the
      crossplane-contrib organization. Installation and usage instructions live in
      the [GitHub repository](https://github.com/crossplane-contrib/provider-upcloud);
      questions and bug reports go to its
      [issue tracker](https://github.com/crossplane-contrib/provider-upcloud/issues).
spec:
  crossplane:
    version: ">=v2.0.0-0"
  capabilities:
  - SafeStart
