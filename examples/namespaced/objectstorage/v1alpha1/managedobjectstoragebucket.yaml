apiVersion: objectstorage.upcloud.m.crossplane.io/v1alpha1
kind: ManagedObjectStorageBucket
metadata:
  annotations:
    meta.upbound.io/example-id: objectstorage/v1alpha1/managedobjectstoragebucket
  labels:
    testing.upbound.io/example-name: bucket-example
  name: bucket-example
  namespace: crossplane-system
spec:
  forProvider:
    serviceUuidRef:
      name: bucket-example-service
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default

---
apiVersion: objectstorage.upcloud.m.crossplane.io/v1alpha1
kind: ManagedObjectStorage
metadata:
  annotations:
    meta.upbound.io/example-id: objectstorage/v1alpha1/managedobjectstoragebucket
  labels:
    testing.upbound.io/example-name: bucket-example-service
  name: bucket-example-service
  namespace: crossplane-system
spec:
  forProvider:
    name: bucket-example-service
    region: europe-1
    configuredStatus: started
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
