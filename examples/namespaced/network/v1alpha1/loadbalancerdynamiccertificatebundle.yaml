apiVersion: network.upcloud.m.crossplane.io/v1alpha1
kind: LoadBalancerDynamicCertificateBundle
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/loadbalancerdynamiccertificatebundle
  labels:
    testing.upbound.io/example-name: lbdyncert-example
  name: lbdyncert-example
  namespace: crossplane-system
spec:
  forProvider:
    name: lbdyncert-example
    keyType: rsa
    hostnames:
      - lb-dynamic.example
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
