apiVersion: network.upcloud.m.crossplane.io/v1alpha1
kind: LoadBalancerFrontendTLSConfig
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/loadbalancerfrontendtlsconfig
  labels:
    testing.upbound.io/example-name: lbfetls-example
  name: lbfetls-example
  namespace: crossplane-system
spec:
  forProvider:
    frontendRef:
      name: lbfetls-example-frontend
    certificateBundleRef:
      name: lbfetls-example-bundle
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default

---
apiVersion: network.upcloud.m.crossplane.io/v1alpha1
kind: LoadBalancerManualCertificateBundle
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/loadbalancerfrontendtlsconfig
  labels:
    testing.upbound.io/example-name: lbfetls-example-bundle
  name: lbfetls-example-bundle
  namespace: crossplane-system
spec:
  forProvider:
    name: lbfetls-example-bundle
    certificate: 
    privateKeySecretRef:
      name: lbfetls-example-bundle-key
      key: privateKey
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default

---
apiVersion: v1
kind: Secret
metadata:
  name: lbfetls-example-bundle-key
  namespace: crossplane-system
type: Opaque
stringData:
  privateKey: 

---
apiVersion: network.upcloud.m.crossplane.io/v1alpha1
kind: LoadBalancerFrontend
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/loadbalancerfrontendtlsconfig
  labels:
    testing.upbound.io/example-name: lbfetls-example-frontend
  name: lbfetls-example-frontend
  namespace: crossplane-system
spec:
  forProvider:
    loadbalancerRef:
      name: lbfetls-example-lb
    defaultBackendNameRef:
      name: lbfetls-example-backend
    mode: http
    port: 8080
    networks:
      - name: public
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default

---
apiVersion: network.upcloud.m.crossplane.io/v1alpha1
kind: LoadBalancerBackend
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/loadbalancerfrontendtlsconfig
  labels:
    testing.upbound.io/example-name: lbfetls-example-backend
  name: lbfetls-example-backend
  namespace: crossplane-system
spec:
  forProvider:
    loadbalancerRef:
      name: lbfetls-example-lb
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default

---
apiVersion: network.upcloud.m.crossplane.io/v1alpha1
kind: LoadBalancer
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/loadbalancerfrontendtlsconfig
  labels:
    testing.upbound.io/example-name: lbfetls-example-lb
  name: lbfetls-example-lb
  namespace: crossplane-system
spec:
  forProvider:
    name: lbfetls-example-lb
    zone: fi-hel2
    plan: development
    configuredStatus: started
    networks:
      - name: private
        type: private
        family: IPv4
        networkRef:
          name: lbfetls-example-network
      - name: public
        type: public
        family: IPv4
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default

---
apiVersion: network.upcloud.m.crossplane.io/v1alpha1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/loadbalancerfrontendtlsconfig
  labels:
    testing.upbound.io/example-name: lbfetls-example-network
  name: lbfetls-example-network
  namespace: crossplane-system
spec:
  forProvider:
    name: lbfetls-example-network
    zone: fi-hel2
    ipNetwork:
      address: 10.38.0.0/24
      dhcp: true
      family: IPv4
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
