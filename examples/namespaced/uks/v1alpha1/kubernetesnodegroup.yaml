apiVersion: uks.upcloud.m.crossplane.io/v1alpha1
kind: KubernetesNodeGroup
metadata:
  annotations:
    meta.upbound.io/example-id: uks/v1alpha1/kubernetesnodegroup
  labels:
    testing.upbound.io/example-name: nodegroup-example
  name: nodegroup-example
  namespace: crossplane-system
spec:
  forProvider:
    nodeCount: 1
    plan: 2xCPU-4GB
    clusterRef:
      name: nodegroup-example-cluster
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default

---
apiVersion: uks.upcloud.m.crossplane.io/v1alpha1
kind: KubernetesCluster
metadata:
  annotations:
    meta.upbound.io/example-id: uks/v1alpha1/kubernetesnodegroup
  labels:
    testing.upbound.io/example-name: nodegroup-example-cluster
  name: nodegroup-example-cluster
  namespace: crossplane-system
spec:
  forProvider:
    name: nodegroup-example-cluster
    zone: fi-hel2
    controlPlaneIpFilter:
      - 0.0.0.0/0
    networkSelector:
      matchLabels:
        testing.upbound.io/example-name: nodegroup-example-network
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default

---
apiVersion: network.upcloud.m.crossplane.io/v1alpha1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: uks/v1alpha1/kubernetesnodegroup
  labels:
    testing.upbound.io/example-name: nodegroup-example-network
  name: uks-nodegroup-${Rand.RFC1123Subdomain}
  namespace: crossplane-system
spec:
  forProvider:
    name: uks-nodegroup-${Rand.RFC1123Subdomain}
    zone: fi-hel2
    ipNetwork:
      address: 172.16.12.0/24
      dhcp: true
      family: IPv4
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
