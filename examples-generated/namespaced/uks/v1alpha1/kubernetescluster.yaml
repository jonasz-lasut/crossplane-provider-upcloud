apiVersion: uks.upcloud.m.crossplane.io/v1alpha1
kind: KubernetesCluster
metadata:
  annotations:
    meta.upbound.io/example-id: uks/v1alpha1/kubernetescluster
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    controlPlaneIpFilter:
    - 0.0.0.0/0
    name: exampleapp
    networkSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    zone: de-fra1

---

apiVersion: network.upcloud.m.crossplane.io/v1alpha1
kind: Gateway
metadata:
  annotations:
    meta.upbound.io/example-id: uks/v1alpha1/kubernetescluster
  labels:
    testing.upbound.io/example-name: example2
  name: example2
  namespace: upbound-system
spec:
  forProvider:
    features:
    - nat
    name: example2-nat-gateway
    router:
    - idSelector:
        matchLabels:
          testing.upbound.io/example-name: example2
    zone: de-fra1

---

apiVersion: network.upcloud.m.crossplane.io/v1alpha1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: uks/v1alpha1/kubernetescluster
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    ipNetwork:
    - address: 172.16.1.0/24
      dhcp: true
      family: IPv4
    name: example-network
    zone: de-fra1

---

apiVersion: network.upcloud.m.crossplane.io/v1alpha1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: uks/v1alpha1/kubernetescluster
  labels:
    testing.upbound.io/example-name: example2
  name: example2
  namespace: upbound-system
spec:
  forProvider:
    ipNetwork:
    - address: 10.10.0.0/24
      dhcp: true
      dhcpDefaultRoute: true
      family: IPv4
    name: example2-network
    routerSelector:
      matchLabels:
        testing.upbound.io/example-name: example2
    zone: de-fra1

---

apiVersion: network.upcloud.m.crossplane.io/v1alpha1
kind: Router
metadata:
  annotations:
    meta.upbound.io/example-id: uks/v1alpha1/kubernetescluster
  labels:
    testing.upbound.io/example-name: example2
  name: example2
  namespace: upbound-system
spec:
  forProvider:
    name: example2-router
