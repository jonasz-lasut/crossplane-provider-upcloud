apiVersion: network.upcloud.crossplane.io/v1alpha1
kind: GatewayConnection
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/gatewayconnection
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    gatewaySelector:
      matchLabels:
        testing.upbound.io/example-name: this
    localRoute:
    - name: local-route
      staticNetwork: 10.123.123.0/24
      type: static
    name: test-connection
    remoteRoute:
    - name: remote-route
      staticNetwork: 100.123.123.0/24
      type: static
    type: ipsec

---

apiVersion: network.upcloud.crossplane.io/v1alpha1
kind: Gateway
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/gatewayconnection
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    features:
    - vpn
    name: gateway-example-gw
    plan: advanced
    router:
    - idSelector:
        matchLabels:
          testing.upbound.io/example-name: this
    zone: pl-waw1

---

apiVersion: network.upcloud.crossplane.io/v1alpha1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/gatewayconnection
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    ipNetwork:
    - address: 172.16.2.0/24
      dhcp: true
      family: IPv4
    name: gateway-example-net
    routerSelector:
      matchLabels:
        testing.upbound.io/example-name: this
    zone: pl-waw1

---

apiVersion: network.upcloud.crossplane.io/v1alpha1
kind: Router
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/gatewayconnection
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    name: gateway-example-router
